name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar cobra rosa e roxa
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: andradebjl24-cmyk
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#FF7ACD
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C084FC

      - name: Publicar animação
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
