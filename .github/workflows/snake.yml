name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate burgundy snake
        uses: Platane/snk@v3
        with:
          github_user_name: andradebjl24-cmyk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D9A0B0&color_dots=%231A1016%23F0DCE4%238A2948%23B34D70%23E6A3B8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23D9A0B0&color_dots=%231A1016%23F0DCE4%238A2948%23B34D70%23E6A3B8

      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
